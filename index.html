<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Olivo - Margenes Online</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
            animation: fadeIn 0.5s ease-in;
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        h1 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 2.5em;
            text-align: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1em;
        }
        
        .input-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .input-group {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 12px;
            border: 2px solid #e9ecef;
            transition: all 0.3s ease;
        }
        
        .input-group:hover {
            border-color: #667eea;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.1);
            transform: translateY(-2px);
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
            font-size: 0.95em;
        }
        
        input[type="number"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #dee2e6;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s ease;
        }
        
        input[type="number"]:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .results {
            margin-top: 40px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
        }
        
        .table-container {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        
        .chart-container {
            background: #f8f9fa;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            height: 400px;
        }
        
        h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.5em;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
        }
        
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #dee2e6;
        }
        
        th {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-weight: 600;
        }
        
        tr:hover {
            background: #e9ecef;
        }
        
        .highlight {
            background: #d4edda;
            font-weight: bold;
            color: #155724;
        }
        
        @media (max-width: 768px) {
            .container {
                padding: 20px;
            }
            
            .results {
                grid-template-columns: 1fr;
            }
            
            h1 {
                font-size: 1.8em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🫒 Calculadora Olivo - Canal Online</h1>
        <p class="subtitle">Herramienta para calcular distribución de ingresos y márgenes</p>
        
        <div class="input-grid">
            <div class="input-group">
                <label for="ventaNeta">💰 Venta Neta (CLP)</label>
                <input type="number" id="ventaNeta" value="2000000" min="0" step="1000">
            </div>
            
            <div class="input-group">
                <label for="compras">🛒 Compras/Costo (CLP)</label>
                <input type="number" id="compras" value="100000" min="0" step="1000">
            </div>
            
            <div class="input-group">
                <label for="comisionCanal">📊 Comisión Canal (%)</label>
                <input type="number" id="comisionCanal" value="8" min="0" max="100" step="0.1">
            </div>
            
            <div class="input-group">
                <label for="comisionPasarela">💳 Comisión Pasarela (%)</label>
                <input type="number" id="comisionPasarela" value="3.49" min="0" max="100" step="0.01">
            </div>
            
            <div class="input-group">
                <label for="costoDelivery">🚚 Costo Delivery (CLP)</label>
                <input type="number" id="costoDelivery" value="3000" min="0" step="100">
            </div>
            
            <div class="input-group">
                <label for="iva">📋 IVA (%)</label>
                <input type="number" id="iva" value="19" min="0" max="100" step="0.1">
            </div>
        </div>
        
        <div class="results">
            <div class="table-container">
                <h2>📈 Resultados Detallados</h2>
                <table id="resultsTable">
                    <thead>
                        <tr>
                            <th>Concepto</th>
                            <th>Monto (CLP)</th>
                        </tr>
                    </thead>
                    <tbody>
                    </tbody>
                </table>
            </div>
            
            <div class="chart-container">
                <h2>🎯 Distribución Visual</h2>
                <canvas id="distributionChart"></canvas>
            </div>
        </div>
    </div>
    
    <script>
        let chart;
        
        function calcular() {
            const ventaNeta = parseFloat(document.getElementById('ventaNeta').value) || 0;
            const compras = parseFloat(document.getElementById('compras').value) || 0;
            const comisionCanal = parseFloat(document.getElementById('comisionCanal').value) || 0;
            const comisionPasarela = parseFloat(document.getElementById('comisionPasarela').value) || 0;
            const costoDelivery = parseFloat(document.getElementById('costoDelivery').value) || 0;
            const iva = parseFloat(document.getElementById('iva').value) || 0;
            
            const montoComisionCanal = ventaNeta * (comisionCanal / 100);
            const montoComisionPasarela = ventaNeta * (comisionPasarela / 100);
            const totalGastos = compras + montoComisionCanal + montoComisionPasarela + costoDelivery;
            const utilidadBruta = ventaNeta - totalGastos;
            const montoIVA = utilidadBruta * (iva / 100);
            const utilidadNeta = utilidadBruta - montoIVA;
            
            const margenBruto = ventaNeta > 0 ? ((utilidadBruta / ventaNeta) * 100).toFixed(2) : 0;
            const margenNeto = ventaNeta > 0 ? ((utilidadNeta / ventaNeta) * 100).toFixed(2) : 0;
            
            const tbody = document.querySelector('#resultsTable tbody');
            tbody.innerHTML = `
                <tr><td>Venta Neta</td><td>$${ventaNeta.toLocaleString('es-CL')}</td></tr>
                <tr><td>Compras/Costos</td><td>-$${compras.toLocaleString('es-CL')}</td></tr>
                <tr><td>Comisión Canal (${comisionCanal}%)</td><td>-$${montoComisionCanal.toLocaleString('es-CL')}</td></tr>
                <tr><td>Comisión Pasarela (${comisionPasarela}%)</td><td>-$${montoComisionPasarela.toLocaleString('es-CL')}</td></tr>
                <tr><td>Costo Delivery</td><td>-$${costoDelivery.toLocaleString('es-CL')}</td></tr>
                <tr><td><strong>Utilidad Bruta</strong></td><td><strong>$${utilidadBruta.toLocaleString('es-CL')}</strong></td></tr>
                <tr><td>Margen Bruto</td><td>${margenBruto}%</td></tr>
                <tr><td>IVA (${iva}%)</td><td>-$${montoIVA.toLocaleString('es-CL')}</td></tr>
                <tr class="highlight"><td><strong>Utilidad Neta</strong></td><td><strong>$${utilidadNeta.toLocaleString('es-CL')}</strong></td></tr>
                <tr class="highlight"><td><strong>Margen Neto</strong></td><td><strong>${margenNeto}%</strong></td></tr>
            `;
            
            actualizarGrafico(ventaNeta, compras, montoComisionCanal, montoComisionPasarela, costoDelivery, montoIVA, utilidadNeta);
        }
        
        function actualizarGrafico(venta, compras, comisionCanal, comisionPasarela, delivery, iva, utilidad) {
            const ctx = document.getElementById('distributionChart').getContext('2d');
            
            if (chart) {
                chart.destroy();
            }
            
            chart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['Compras', 'Comisión Canal', 'Comisión Pasarela', 'Delivery', 'IVA', 'Utilidad Neta'],
                    datasets: [{
                        data: [compras, comisionCanal, comisionPasarela, delivery, iva, utilidad],
                        backgroundColor: [
                            '#ff6384',
                            '#36a2eb',
                            '#ffce56',
                            '#4bc0c0',
                            '#9966ff',
                            '#4caf50'
                        ],
                        borderWidth: 2,
                        borderColor: '#fff'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: {
                                padding: 15,
                                font: {
                                    size: 12
                                }
                            }
                        },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    const label = context.label || '';
                                    const value = context.parsed || 0;
                                    const percentage = ((value / venta) * 100).toFixed(1);
                                    return `${label}: $${value.toLocaleString('es-CL')} (${percentage}%)`;
                                }
                            }
                        }
                    }
                }
            });
        }
        
        document.addEventListener('DOMContentLoaded', function() {
            const inputs = document.querySelectorAll('input[type="number"]');
            inputs.forEach(input => {
                input.addEventListener('input', calcular);
            });
            
            calcular();
        });
    </script>
</head>
<body>
</body>
</html>

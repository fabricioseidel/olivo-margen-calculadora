<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"/><title>Calculadora Olivo - Margenes Online</title><meta name="viewport" content="width=device-width,initial-scale=1"/><script src="https://cdn.tailwindcss.com"></script><script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script><script src="https://cdn.jsdelivr.net/npm/chart.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script><script>tailwind.config={darkMode:'class',theme:{extend:{animation:{'fade-in':'fadeIn 0.5s ease-in'}}}}</script><style>@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}.fade-in{animation:fadeIn 0.5s ease-in}</style></head><body class="min-h-screen transition-colors duration-300"x-data="{dark:localStorage.getItem('dark')==='true',ventas:2000000,iva:0.19,costo:0.679,pasarela:0.025,comision:0.125,retencion:0.1525,chart:null,initTheme(){this.dark=localStorage.getItem('dark')==='true'||false;this.updateTheme()},updateTheme(){if(this.dark){document.documentElement.classList.add('dark');localStorage.setItem('dark','true')}else{document.documentElement.classList.remove('dark');localStorage.setItem('dark','false')}},toggleDark(){this.dark=!this.dark;this.updateTheme()},get calc(){const v=this.ventas,i=this.iva;const nv=v/(1+i),id=v-nv;const cb=v*this.costo,cn=cb/(1+i),ic=cb-cn;const mnp=nv-cn;const pn=v*this.pasarela,piv=pn*i;const cob=v*this.comision,ret=cob*this.retencion,liq=cob-ret;const uo=mnp-pn-cob;return{nv,id,cb,cn,ic,mnp,pn,piv,cob,ret,liq,uo}},fmt(n){return Math.round(n).toLocaleString('es-CL')},renderChart(){const c=this.calc;if(this.chart)this.chart.destroy();const ctx=document.getElementById('chart').getContext('2d');this.chart=new Chart(ctx,{type:'bar',data:{labels:['Utilidad Olivo','Tu Liquido','Pasarela'],datasets:[{label:'CLP',data:[c.uo,c.liq,c.pn],backgroundColor:['#10b981','#3b82f6','#f97316']}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true}}}})},saveConfig(){const cfg={ventas:this.ventas,iva:this.iva,costo:this.costo,pasarela:this.pasarela,comision:this.comision,retencion:this.retencion};localStorage.setItem('olivoConfig',JSON.stringify(cfg));alert('Configuracion guardada')},loadConfig(){const cfg=localStorage.getItem('olivoConfig');if(cfg){const d=JSON.parse(cfg);this.ventas=d.ventas||2000000;this.iva=d.iva||0.19;this.costo=d.costo||0.679;this.pasarela=d.pasarela||0.025;this.comision=d.comision||0.125;this.retencion=d.retencion||0.1525}},exportPDF(){const{jsPDF}=window.jspdf;const doc=new jsPDF();doc.text('Calculadora Olivo - Resultados',20,20);doc.text(`Ventas: $${this.fmt(this.ventas)}`,20,40);doc.text(`Tu Liquido: $${this.fmt(this.calc.liq)}`,20,50);doc.text(`Utilidad Olivo: $${this.fmt(this.calc.uo)}`,20,60);doc.save('olivo-calculo.pdf')},copyResults(){const t=`Ventas: $${this.fmt(this.ventas)}\nTu liquido: $${this.fmt(this.calc.liq)}\nUtilidad Olivo: $${this.fmt(this.calc.uo)}`;navigator.clipboard.writeText(t).then(()=>alert('Copiado al portapapeles'))}}"x-init="initTheme();loadConfig();$nextTick(()=>renderChart())"x-effect="renderChart()":class="dark?'bg-slate-900 text-gray-100':'bg-gray-50 text-gray-900'"><div class="container mx-auto p-4 max-w-6xl"><div class="flex justify-between items-center mb-6 fade-in"><h1 class="text-3xl font-bold bg-gradient-to-r from-green-500 to-blue-500 bg-clip-text text-transparent">Calculadora Olivo</h1><div class="flex gap-2"><button@click="toggleDark()"class="p-2 rounded-lg hover:bg-gray-200 dark:hover:bg-gray-700 transition"><svgx-show="!dark"class="w-6 h-6"fill="none"stroke="currentColor"viewBox="0 0 24 24"><path stroke-linecap="round"stroke-linejoin="round"stroke-width="2"d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg><svgx-show="dark"class="w-6 h-6"fill="none"stroke="currentColor"viewBox="0 0 24 24"><path stroke-linecap="round"stroke-linejoin="round"stroke-width="2"d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg></button><buttonx-on:click="saveConfig()"class="px-4 py-2 bg-green-500 text-white rounded-lg hover:bg-green-600 transition">Guardar</button><buttonx-on:click="copyResults()"class="px-4 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600 transition">Copiar</button><buttonx-on:click="exportPDF()"class="px-4 py-2 bg-orange-500 text-white rounded-lg hover:bg-orange-600 transition">PDF</button></div></div><div class="grid md:grid-cols-3 gap-4 mb-6 fade-in"><div class="p-4 rounded-xl shadow-lg":class="dark?'bg-slate-800':'bg-white'"><label class="block text-sm font-medium mb-2">Ventas totales (IVA incl.)</label><inputx-model.number="ventas"type="number"class="w-full p-2 rounded-lg border":class="dark?'bg-slate-700 border-gray-600':'bg-gray-50 border-gray-300'"/></div><div class="p-4 rounded-xl shadow-lg":class="dark?'bg-slate-800':'bg-white'"><label class="block text-sm font-medium mb-2">IVA</label><inputx-model.number="iva"type="number"step="0.01"class="w-full p-2 rounded-lg border":class="dark?'bg-slate-700 border-gray-600':'bg-gray-50 border-gray-300'"/></div><div class="p-4 rounded-xl shadow-lg":class="dark?'bg-slate-800':'bg-white'"><label class="block text-sm font-medium mb-2">Costo/Venta</label><inputx-model.number="costo"type="number"step="0.001"class="w-full p-2 rounded-lg border":class="dark?'bg-slate-700 border-gray-600':'bg-gray-50 border-gray-300'"/></div><div class="p-4 rounded-xl shadow-lg":class="dark?'bg-slate-800':'bg-white'"><label class="block text-sm font-medium mb-2">% Pasarela</label><inputx-model.number="pasarela"type="number"step="0.001"class="w-full p-2 rounded-lg border":class="dark?'bg-slate-700 border-gray-600':'bg-gray-50 border-gray-300'"/></div><div class="p-4 rounded-xl shadow-lg":class="dark?'bg-slate-800':'bg-white'"><label class="block text-sm font-medium mb-2">% Tu Comision</label><inputx-model.number="comision"type="number"step="0.001"class="w-full p-2 rounded-lg border":class="dark?'bg-slate-700 border-gray-600':'bg-gray-50 border-gray-300'"/></div><div class="p-4 rounded-xl shadow-lg":class="dark?'bg-slate-800':'bg-white'"><label class="block text-sm font-medium mb-2">% Retencion</label><inputx-model.number="retencion"type="number"step="0.0001"class="w-full p-2 rounded-lg border":class="dark?'bg-slate-700 border-gray-600':'bg-gray-50 border-gray-300'"/></div></div><div class="grid md:grid-cols-2 gap-6 fade-in"><div class="p-6 rounded-xl shadow-lg":class="dark?'bg-slate-800':'bg-white'"><h2 class="text-xl font-bold mb-4">Resultados</h2><div class="space-y-2 font-mono text-sm"><div class="flex justify-between"><span>Neto ventas:</span><spanx-text="fmt(calc.nv)"></span></div><div class="flex justify-between"><span>Margen neto:</span><spanx-text="fmt(calc.mnp)"></span></div><div class="flex justify-between"><span>Pasarela:</span><spanx-text="fmt(calc.pn)"></span></div><div class="flex justify-between text-lg font-bold text-blue-500"><span>Tu liquido:</span><spanx-text="fmt(calc.liq)"></span></div><div class="flex justify-between text-lg font-bold text-green-500"><span>Utilidad Olivo:</span><spanx-text="fmt(calc.uo)"></span></div></div></div><div class="p-6 rounded-xl shadow-lg":class="dark?'bg-slate-800':'bg-white'"><h2 class="text-xl font-bold mb-4">Distribucion</h2><div style="height:300px"><canvas id="chart"></canvas></div></div></div></div></body></html>
